name: "Real containment smoke"

# Separate from the managed defined gate. This job exists to prove the shipped
# tarball against real Podman containers; it is not a unit-test runner.

on:
    pull_request:
    push:

concurrency:
    group: otc-smoke-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    smoke:
        runs-on: ubuntu-26.04
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "26"
                  cache: npm

            - name: Podman preflight
              shell: bash
              run: |
                  set -euo pipefail
                  if ! command -v podman >/dev/null 2>&1; then
                      sudo apt-get update
                      sudo apt-get install -y podman
                  fi
                  podman --version
                  podman info --format 'rootless={{.Host.Security.Rootless}}'
                  test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"

            - name: Install
              # No dependency in this lockfile installs a lifecycle script, so
              # the install must not allow one to run (githubactions:S6505).
              run: npm ci --ignore-scripts

            - name: Smoke
              run: npm run test:smoke
