# SonarCloud analysis (project key markstanden_opencode-test-container).
# Automatic Analysis is off: .github/workflows/sonarqube--scan.yml is the only
# producer of an analysis, and it is what makes this file take effect.
#
# Scope: the shipped TypeScript runtime. Shell, YAML and JSON are handled by the
# defined gate (`defined comply`) instead; rehearsals and examples are
# consumer-facing scaffolding, not package source.

sonar.projectKey=markstanden_opencode-test-container
sonar.organization=markstanden
sonar.projectName=opencode-test-container
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

# Captured campaign evidence is data, not test code: indexed it would be
# counted as unexercised test scope and duplicated against the gate.
sonar.exclusions=tests/fixtures/**

# package.json:test:coverage writes this through node --test's lcov reporter.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# A red gate fails the scan job rather than only decorating the PR.
sonar.qualitygate.wait=true
